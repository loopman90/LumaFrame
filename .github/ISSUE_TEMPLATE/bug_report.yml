name: Bug report
description: Report something that is broken or confusing.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LumaFrame version
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Desktop
        - Mobile
        - Both
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Add logs only if they do not reveal private filenames or media.
