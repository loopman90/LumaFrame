name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          body: |
            LumaFrame release built from the tagged source.

            Includes the required plugin assets:
            - main.js
            - manifest.json
            - styles.css

            Validation:
            - Build passed.
            - Tests passed.
            - GitHub artifact attestations are generated for main.js and styles.css.
          files: |
            main.js
            manifest.json
            styles.css

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css
